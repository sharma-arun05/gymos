name: GymOS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    name: TypeCheck, Unit Tests, & Production Bundle
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run ESLint & TypeScript Type Validation
      run: npx tsc --noEmit

    - name: Run Production Vite Build
      run: npm run build

    - name: Verify Bundle Integrity
      run: ls -la dist/

    - name: Upload Artifacts (Dist Bundle)
      uses: actions/upload-artifact@v4
      with:
        name: gymos-production-build
        path: dist/
        retention-days: 7
